# Optional DXVK configuration for Rhino 7 under Wine.
#
# Rhino 7 renders its viewports with OpenGL, so this file does nothing for the
# 3D views. It only matters for Direct3D consumers inside the prefix: a few
# WPF/Eto dialogs (D3D9), the Windows Media based video help, and third party
# plugins that bring their own D3D11 renderer. DXVK is off unless you pass
# --dxvk to install.sh or set RHINO_DXVK=1.

# Report the real adapter; Rhino's diagnostics and plugin checks read it.
dxgi.hideNvidiaGpu = False
dxgi.hideAmdGpu = False
dxgi.hideIntelGpu = False
d3d9.hideNvidiaGpu = False

# Shader and pipeline compilation
dxvk.enableGraphicsPipelineLibrary = True
# 0 lets DXVK use every available hardware thread for background compilation.
dxvk.numCompilerThreads = 0
dxvk.trackPipelineLifetime = True

# Presentation: a CAD UI wants latency, not buffered frames.
dxgi.syncInterval = 0
d3d9.presentInterval = 0
dxgi.maxFrameLatency = 1
d3d9.maxFrameLatency = 1
dxvk.tearFree = False

# Direct3D 9 (dialogs and control rendering)
d3d9.cachedWriteOnlyBuffers = True
d3d9.deviceLocalConstantBuffers = True

# Direct3D 11 (plugin renderers)
d3d11.relaxedBarriers = True
d3d11.cachedDynamicResources = "a"
d3d11.samplerAnisotropy = 16
